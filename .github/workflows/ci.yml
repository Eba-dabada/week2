name: ci

on:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from pins
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Run tests
        run: python -m pytest

      - name: Smoke train
        run: python -m src.train --smoke --out runs/smoke.pt

      - name: Download released checkpoint
        run: |
          URL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['reproduce']['checkpoint_url'])")
          curl -L --fail -o best_model.pt "$URL"

      - name: Evaluate released checkpoint
        run: python -m src.evaluate --checkpoint best_model.pt --metrics-out metrics.json

      - name: Compare with claimed metric
        run: |
          python - <<'EOF'
          import json, sys, tomllib

          cfg = tomllib.load(open("pyproject.toml", "rb"))["tool"]["reproduce"]
          metrics = json.load(open("metrics.json"))

          name = cfg["metric_name"]
          claimed = float(cfg["metric_value"])
          tolerance = float(cfg["tolerance"])
          measured = float(metrics[name])

          print(f"{name}: measured={measured:.4f} claimed={claimed:.4f} tolerance={tolerance}")
          if tolerance > 0.02:
              sys.exit("tolerance must be at most 0.02")
          if abs(measured - claimed) > tolerance:
              sys.exit("metric differs from claim by more than the tolerance")
          EOF